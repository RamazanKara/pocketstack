name: showcase previews

on:
  push:
    branches: [main]
    paths:
      - "examples/showcase/**"
      - "internal/**"
      - "web/runtime/**"
      - "scripts/action/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pocket Supply storefront
            slug: storefront
            compose: examples/showcase/storefront/compose.yaml
            node-directory: examples/showcase/storefront
            branch: storefront-demo
          - name: Northstar sprint board
            slug: sprint-board
            compose: examples/showcase/sprint-board/compose.yaml
            node-directory: examples/showcase/sprint-board
            branch: sprint-board-demo
          - name: Clearview analytics
            slug: analytics
            compose: examples/showcase/analytics/compose.yaml
            node-directory: ""
            branch: analytics-dashboard-demo

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - name: Build PocketStack
        run: |
          npm ci
          npm run build:runtime
          go build -trimpath -o bin/pocketstack ./cmd/pocketstack
      - name: Verify the example application
        if: matrix.node-directory != ''
        working-directory: ${{ matrix.node-directory }}
        run: |
          npm ci
          npm run build
      - name: Generate the static PocketStack preview
        run: |
          bin/pocketstack analyze -f "${{ matrix.compose }}"
          bin/pocketstack demo -f "${{ matrix.compose }}" -o "dist/showcase-${{ matrix.slug }}"
      - name: Deploy the stable showcase branch
        run: >-
          npx --yes wrangler@4.112.0 pages deploy
          "dist/showcase-${{ matrix.slug }}"
          --project-name pocketstack-examples
          --branch "${{ matrix.branch }}"
          --commit-hash "${{ github.sha }}"
          --commit-message "PocketStack ${{ matrix.name }} showcase"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
