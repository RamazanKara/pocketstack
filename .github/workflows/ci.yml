name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.22"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build:wasi-example
      - run: npm run build:runtime
      - run: npm run test:runtime
      - run: npm run test:action
      - run: npm run showcases:install
      - run: npm run showcases:build
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o bin/pocketstack ./cmd/pocketstack
      - run: make pages
      - run: npx playwright install --with-deps chromium webkit msedge
      - run: npm run test:browsers
        env:
          POCKETSTACK_REQUIRE_BROWSERS: "1"
      - run: npm run test:showcases
